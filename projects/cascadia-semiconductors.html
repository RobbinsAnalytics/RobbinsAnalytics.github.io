<!doctype html>
<!--
  Redirect stub for the case study's old path, replacing Quarto's `aliases:`.

  Quarto's alias emits a page whose title is literally "Redirect" and which
  carries no social metadata, so a shared old link rendered a card reading
  "Redirect" with no image. Its redirect is also JavaScript-only. This file is
  hand-written for the same reason the /cascadia-semiconductors/ stubs are: a
  scraper stops at the redirect page and never follows it, so the card has to
  live here.

  Because this replaces the alias, `aliases:` must stay OUT of
  cascadia-finance.qmd — Quarto would regenerate this path and overwrite the
  file. And because it is not a render input, it only reaches _site via the
  `resources:` list in _quarto.yml. Both halves are load-bearing.

  og:title, og:description and og:image mirror the case study's own card;
  og:url points at its new path.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved — Cascadia Finance</title>
<link rel="canonical" href="https://www.robbinsanalytics.com/projects/cascadia-finance.html">
<meta http-equiv="refresh" content="0; url=https://www.robbinsanalytics.com/projects/cascadia-finance.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Cascadia Finance – Robbins Analytics">
<meta property="og:description" content="FormFactor’s GAAP financials from SEC EDGAR XBRL — an executive close pack built in Python, SQLite, and static ECharts.">
<meta property="og:image" content="https://www.robbinsanalytics.com/assets/thumb-finance.png">
<meta property="og:url" content="https://www.robbinsanalytics.com/projects/cascadia-finance.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.robbinsanalytics.com/assets/thumb-finance.png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 2rem; text-align: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #1d2b25;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; }
  a { color: #2f6f4f; }
  .note { color: #6b7770; font-size: .875rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #14201a; color: #e8efea; }
    a { color: #8fd3ae; }
    .note { color: #93a49a; }
  }
</style>
</head>
<body>
<main>
  <h1>This page has moved</h1>
  <p>The Cascadia Finance case study now lives at a URL that matches its name.</p>
  <p><a href="https://www.robbinsanalytics.com/projects/cascadia-finance.html">www.robbinsanalytics.com/projects/cascadia-finance.html</a></p>
  <p class="note">Redirecting automatically…</p>
</main>
</body>
</html>
