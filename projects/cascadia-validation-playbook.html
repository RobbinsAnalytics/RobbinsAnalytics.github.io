<!doctype html>
<!--
  Redirect stub for the validation playbook's site-relative path.

  The playbook is a Felix page served from its own repository at
  /cascadia-validation-playbook/, beside the module pages that are published
  the same way. Nothing on this site ever rendered at this path; the stub
  exists so that a link written against the projects/ convention, or a social
  card scraped from it, lands on the page rather than a 404. Hand-written
  rather than a Quarto `aliases:` entry, for the same reason as the Cascadia
  Finance and Early Warning stubs beside it: the alias emits a page titled
  "Redirect" with no social metadata, and a scraper stops at the redirect page
  and never follows it, so the card has to live here.

  There is no projects/cascadia-validation-playbook.qmd and there must not be
  one: a render input at this path would regenerate this file and overwrite
  it. And because this file is not a render input, it only reaches _site via
  the `resources:` list in _quarto.yml. Both halves are load-bearing.

  og:description is the page's own meta description; og:image is the site's
  card for the playbook; og:url points at the page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved: Validating AI-Assisted Analytics</title>
<link rel="canonical" href="https://www.robbinsanalytics.com/cascadia-validation-playbook/">
<meta http-equiv="refresh" content="0; url=https://www.robbinsanalytics.com/cascadia-validation-playbook/">
<meta property="og:type" content="website">
<meta property="og:title" content="Validating AI-Assisted Analytics – Robbins Analytics">
<meta property="og:description" content="How can you be confident in code you did not read or write in full? One invented dispatch rule, a known answer specified before the code, and four experiments in the browser that show what a check adds to reading.">
<meta property="og:image" content="https://www.robbinsanalytics.com/assets/thumb-validation-playbook.png">
<meta property="og:url" content="https://www.robbinsanalytics.com/cascadia-validation-playbook/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.robbinsanalytics.com/assets/thumb-validation-playbook.png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 2rem; text-align: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #1d2b25;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; }
  /* The destination URL is printed as one unbreakable token, and at a 320 px
     viewport it ran 32 px past the edge (WCAG 1.4.10, found 2026-10-14 when
     the accessibility check started visiting the stubs). */
  a { color: #2f6f4f; overflow-wrap: anywhere; }
  .note { color: #6b7770; font-size: .875rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #14201a; color: #e8efea; }
    a { color: #8fd3ae; }
    .note { color: #93a49a; }
  }
</style>
</head>

</html>
