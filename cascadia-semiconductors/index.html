<!doctype html>
<!--
  Redirect stub. The Cascadia Finance module moved from /cascadia-semiconductors/
  to /cascadia-finance/ when its URLs were renamed to match its narrowed scope.

  GitHub does not redirect project Pages URLs when a repository is renamed — it
  is the one documented exception — and because this is a project site under a
  user-site custom domain, the URL path segment *is* the repository name. So the
  old path cannot redirect on its own; something has to serve it. This file is
  that something.

  It sits inert while the project repo still owns this path (a project repo
  takes precedence over a same-named directory in the user site), then activates
  the moment the rename frees the name. That is what keeps the 404 window to
  near zero.
-->
