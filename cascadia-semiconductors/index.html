<!doctype html>
<!--
  Redirect stub. The Cascadia Finance module moved from /cascadia-semiconductors/
  to /cascadia-finance/ when its URLs were renamed to match its narrowed scope.

  GitHub does not redirect project Pages URLs when a repository is renamed — it
  is the one documented exception — and because this is a project site under a
  user-site custom domain, the URL path segment *is* the repository name. So the
  old path cannot redirect on its own; something has to serve it. This file is
  that something.

  It sits inert while the project repo still owns this path (a project repo
  takes precedence over a same-named directory in the user site), then activates
  the moment the rename frees the name. That is what keeps the 404 window to
  near zero.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved — Cascadia Finance Executive Pack</title>
<link rel="canonical" href="https://www.robbinsanalytics.com/cascadia-finance/">
<meta http-equiv="refresh" content="0; url=https://www.robbinsanalytics.com/cascadia-finance/">
<!--
  A browser never sees this page — the refresh fires first. A social scraper
  does: it stops here and never follows the redirect. Without these tags a
  previously shared old link renders as "Moved —" with no image. og:url points
  at the TARGET, not at this file, so platforms that honour it attribute the
  share to the live page. Title, description and image mirror that page exactly.
-->
<meta property="og:type" content="website">
<meta property="og:title" content="Cascadia Finance — FormFactor Executive Financial Pack">
<meta property="og:description" content="GAAP quarterly financials for FormFactor (NASDAQ: FORM) from SEC EDGAR XBRL — an independent portfolio project.">
<meta property="og:image" content="https://www.robbinsanalytics.com/cascadia-finance/assets/og-finance.png">
<meta property="og:url" content="https://www.robbinsanalytics.com/cascadia-finance/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.robbinsanalytics.com/cascadia-finance/assets/og-finance.png">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 2rem; text-align: center;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #1d2b25;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: .5rem 0; }
  a { color: #2f6f4f; }
  .note { color: #6b7770; font-size: .875rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #14201a; color: #e8efea; }
    a { color: #8fd3ae; }
    .note { color: #93a49a; }
  }
</style>
</head>
<body>
<main>
  <h1>This page has moved</h1>
  <p>Cascadia Finance now lives at a URL that matches its name.</p>
  <p><a href="https://www.robbinsanalytics.com/cascadia-finance/">www.robbinsanalytics.com/cascadia-finance/</a></p>
  <p class="note">Redirecting automatically…</p>
</main>
</body>
</html>
