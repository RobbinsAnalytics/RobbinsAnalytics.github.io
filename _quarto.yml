project:
  type: website
  output-dir: _site
  # Copy the whole assets folder. Listing individual files silently drops any
  # new one: the OG images are referenced as absolute URLs in each page's front
  # matter, so Quarto never sees them as project references and will not copy
  # them on its own. Six of eight thumbnails 404'd on the live site until this
  # changed, 2026-08-02.
  resources:
    - assets/
    # CNAME must be copied into _site on every build. The publish workflow runs
    # `quarto publish gh-pages`, which rebuilds the gh-pages branch from _site
    # and force-pushes it — so any CNAME file GitHub wrote to that branch is
    # destroyed on the next deploy, the custom domain setting clears, and the
    # site silently falls back to the github.io address. Shipping it as a
    # resource is what makes the custom domain survive a rebuild.
    - CNAME
    # The deploy's own receipt. CI overwrites this with the pushed commit SHA
    # before rendering, then polls https://www.robbinsanalytics.com/build.txt
    # until the edge returns that same SHA. Verifying from a local shell could
    # pass against a stale CDN edge while the Action was already green; this
    # makes "the live site is actually serving this commit" the Action's own
    # pass/fail. The committed value is the placeholder `local`.
    - build.txt
    # Redirect stubs for the module's old /cascadia-semiconductors/ URLs. Same
    # reason as CNAME above: `quarto publish gh-pages` rebuilds the branch from
    # _site and force-pushes, so anything not copied in is destroyed on the next
    # deploy. GitHub does not redirect project Pages URLs on a repo rename, so
    # these files are the only thing standing between every previously shared
    # link — and every social card already in the wild — and a 404.
    - cascadia-semiconductors/
    # The case study's old path. Hand-written rather than a Quarto `aliases:`
    # entry, because the alias emits a page titled "Redirect" carrying no
    # og: tags — a scraper stops there and never follows the redirect, so a
    # shared old link produced a card reading "Redirect" with no image. Not a
    # render input, so this line is the only thing that puts it in _site.
    - projects/cascadia-semiconductors.html

website:
  title: "Robbins Analytics"
  description: "Business Intelligence & Analytics portfolio — Aaron Robbins"
  site-url: "https://www.robbinsanalytics.com"
  favicon: assets/brand/favicon.svg
  open-graph: true
  twitter-card: true

  navbar:
    background: dark
    foreground: light
    # The navbar is Spruce ($navbar-bg in styles.scss), which is exactly the
    # surface LOGO.md 1.1 sends to the reversed cut — so this is the reversed
    # mark, not the light one. They are separate cuts, not recolours (3.3), and
    # the light mark's Rain #828E88 context bars measure 1.15:1 against dark
    # Evergreen on Spruce, which would merge the bars into one shape.
    #
    # The mark only, beside the existing text title — not the primary lockup.
    # At navbar height the lockup runs near the 12px floor of Rule 5.3 and the
    # ligature has not been proofed there.
    logo: assets/brand/robbins-mark-reversed.svg
    logo-alt: "Robbins Analytics"
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Cascadia"
        href: cascadia.qmd
      - text: "Projects"
        menu:
          - text: "Cascadia Control Tower"
            href: projects/cascadia-controltower.qmd
          - text: "Cascadia Deal Desk"
            href: projects/cascadia-dealdesk.qmd
          - text: "Cascadia Finance"
            href: projects/cascadia-finance.qmd
          - text: "Cascadia BI Migration"
            href: projects/cascadia-bi-migration.qmd
          - text: "Cascadia Staffing"
            href: projects/cascadia-staffing.qmd
          - text: "Cascadia Pharmacy"
            href: projects/cascadia-pharmacy.qmd
          - text: "Cascadia Medical Devices"
            href: projects/cascadia-medical-devices.qmd
          - text: "Cascadia Clothing (Coming Soon)"
            href: projects/cascadia-clothing.qmd
    right:
      - icon: github
        href: https://github.com/RobbinsAnalytics
        aria-label: GitHub

  page-footer:
    left: "© 2026 Aaron Robbins"
    right:
      - icon: github
        href: https://github.com/RobbinsAnalytics
      - icon: linkedin
        href: https://www.linkedin.com/in/aaron-robbins-6b25a2136/

format:
  html:
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
          <!-- LOGO.md 4.2. SVG first so it wins wherever it is supported and
               the mark can swap palettes with the browser chrome; the 32px PNG
               is for Safari, which renders SVG favicons but ignores the
               embedded prefers-color-scheme block. Quarto's own favicon: key
               emits the SVG link; these are the ones it cannot express. -->
          <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32">
          <link rel="icon" href="/assets/brand/favicon-16.png" sizes="16x16">
          <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
    theme:
      - cosmo
      - styles.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
