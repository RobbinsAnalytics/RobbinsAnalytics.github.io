project:
  type: website
  output-dir: _site
  # Three files are generated before every render and are never committed
  # (_generated/ is gitignored): the footer, from data/portfolio.yml; the
  # Build by Build matrix, from the committed snapshot data/build-by-build.json;
  # and the homepage stat strip, from data/stats.json.
  # Both scripts are standard library plus PyYAML for the footer, which both
  # workflows install before `quarto render`.
  pre-render:
    - tools/build_footer.py
    - tools/build_bbb_grid.py
    - tools/build_stats.py
  # Copy the whole assets folder. Listing individual files silently drops any
  # new one: the OG images are referenced as absolute URLs in each page's front
  # matter, so Quarto never sees them as project references and will not copy
  # them on its own. Six of eight thumbnails 404'd on the live site until this
  # changed, 2026-08-02.
  resources:
    - assets/
    # CNAME must be copied into _site on every build. The publish workflow runs
    # `quarto publish gh-pages`, which rebuilds the gh-pages branch from _site
    # and force-pushes it — so any CNAME file GitHub wrote to that branch is
    # destroyed on the next deploy, the custom domain setting clears, and the
    # site silently falls back to the github.io address. Shipping it as a
    # resource is what makes the custom domain survive a rebuild.
    - CNAME
    # The deploy's own receipt. CI overwrites this with the pushed commit SHA
    # before rendering, then polls https://www.robbinsanalytics.com/build.txt
    # until the edge returns that same SHA. Verifying from a local shell could
    # pass against a stale CDN edge while the Action was already green; this
    # makes "the live site is actually serving this commit" the Action's own
    # pass/fail. The committed value is the placeholder `local`.
    - build.txt
    # The four-page Cascadia operating system is static HTML with its own
    # scoped assets. Quarto must copy the bundle without re-rendering it.
    - cascadia/
    # Keep the previously shared URL as a redirect, without retaining the old
    # Cascadia Family page. There is no cascadia.qmd render input now.
    - cascadia.html
    # Redirect stubs for the module's old /cascadia-semiconductors/ URLs. Same
    # reason as CNAME above: `quarto publish gh-pages` rebuilds the branch from
    # _site and force-pushes, so anything not copied in is destroyed on the next
    # deploy. GitHub does not redirect project Pages URLs on a repo rename, so
    # these files are the only thing standing between every previously shared
    # link — and every social card already in the wild — and a 404.
    - cascadia-semiconductors/
    # The case study's old path. Hand-written rather than a Quarto `aliases:`
    # entry, because the alias emits a page titled "Redirect" carrying no
    # og: tags — a scraper stops there and never follows the redirect, so a
    # shared old link produced a card reading "Redirect" with no image. Not a
    # render input, so this line is the only thing that puts it in _site.
    - projects/cascadia-semiconductors.html
    # Cascadia Early Warning's case study moved to the module's own repository
    # (/cascadia-early-warning/case-study.html). Same stub, same reason, and
    # the old .qmd is deleted so Quarto cannot regenerate this path.
    - projects/cascadia-early-warning.html
    # The validation playbook is a Felix page served from its own repository
    # (/cascadia-validation-playbook/). This stub guards the projects/ path a
    # reader or a scraper would guess; same shape, same reason, and no .qmd
    # exists at the path so Quarto cannot regenerate it.
    - projects/cascadia-validation-playbook.html

website:
  title: "Robbins Analytics"
  description: "AI analytics architecture portfolio, Aaron Robbins. Governed analytics, built with AI and proven by tests."
  site-url: "https://www.robbinsanalytics.com"
  favicon: assets/brand/favicon.svg
  open-graph: true
  twitter-card: true

  navbar:
    # Ribbon A approved 2026-10-24: one accessible home link contains the
    # decorative symbol and live Inter Tight / Fraunces wordmark. Analytics
    # and its retained period share dark teal. See assets/brand/README.md.
    background: light
    foreground: dark
    title: '<img class="ra-brand-symbol" src="/assets/brand/robbins-mark.svg" alt="" width="60" height="51"><span class="ra-brand-text">Robbins <em>Analytics</em><span class="fx-wm-stop">.</span></span>'
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Cascadia"
        href: /cascadia/
      - text: "Case Studies"
        menu:
          - text: "Build by Build"
            href: projects/cascadia-build-by-build.qmd
          # Not a module: the operating charter, how the author would run a
          # data team. It carries the Cascadia prefix as BI Migration does
          # (a design, not a build) and sits second because it is the page
          # a reader of the portfolio is most often sent to.
          - text: "Cascadia Operating Charter"
            href: projects/cascadia-operating-charter.qmd
          # Not a module: a playbook, how confidence in AI-assisted code is
          # earned from requirements, a separately specified answer and an
          # enforced check. A Felix page in its own repository, linked by its
          # live URL as Early Warning is; it sits beside the charter because
          # the two are read together.
          - text: "Validating AI-Assisted Analytics"
            href: https://www.robbinsanalytics.com/cascadia-validation-playbook/
          - text: "Cascadia Claim Integrity"
            href: https://www.robbinsanalytics.com/cascadia-claim-integrity/case-study.html
          - text: "Cascadia Early Warning"
            href: https://www.robbinsanalytics.com/cascadia-early-warning/case-study.html
          - text: "Cascadia Revenue Assurance"
            href: projects/cascadia-revenue-assurance.qmd
          - text: "Cascadia Fee Examiner"
            href: projects/cascadia-fee-examiner.qmd
          - text: "Cascadia Matter Ledger"
            href: projects/cascadia-matter-ledger.qmd
          - text: "Cascadia Control Tower"
            href: projects/cascadia-controltower.qmd
          - text: "Cascadia Deal Desk"
            href: projects/cascadia-dealdesk.qmd
          - text: "Cascadia Finance"
            href: projects/cascadia-finance.qmd
          - text: "Cascadia BI Migration"
            href: projects/cascadia-bi-migration.qmd
          - text: "Cascadia Staffing"
            href: projects/cascadia-staffing.qmd
          - text: "Cascadia Pharmacy"
            href: projects/cascadia-pharmacy.qmd
          - text: "Cascadia Medical Devices"
            href: projects/cascadia-medical-devices.qmd
          - text: "Cascadia Clothing (Coming Soon)"
            href: projects/cascadia-clothing.qmd
          # Not a Cascadia module: a process design, labelled as what it is,
          # with no "Cascadia" prefix and no status word. It sits beside the
          # preprint below, which stays last.
          - text: "Job Offer Process Map (process design)"
            href: projects/job-offer-process-map.qmd
          # Last, and labelled as what it is. Not a Cascadia module — a
          # mathematics preprint — so it carries neither the "Cascadia" prefix
          # every entry above shares nor a status word that would read as a
          # build state.
          - text: "Sibling Conflict (mathematics paper)"
            href: projects/sibling-conflict.qmd
          # The index: every entry above, numbered, with status tabs. Last,
          # as the Felix dropdown has it (ADR 0002, 2026-10-14).
          - text: "All case studies"
            href: case-studies.qmd
    # No right-hand items: the GitHub icon moved to the footer with the
    # reskin (Felix's header has none), where the footer already carried it.

  # No page-footer. The footer is Felix's four-column form (§6.11) and is
  # generated by tools/build_footer.py from data/portfolio.yml into
  # _generated/footer.html, included after the body of every page (see
  # format.html.include-after-body). Quarto's own footer has three text
  # slots and cannot carry it. The two icon links keep their aria-labels
  # there (see the axe note that used to sit here, 2026-08-25).

format:
  html:
    # The generated footer, on every page. Written by tools/build_footer.py
    # before each render; absent from a clean checkout until then.
    include-after-body:
      - _generated/footer.html
    # Splices the other generated fragments (the stat strip, the matrix)
    # into index.qmd. A filter, not an include shortcode: shortcodes expand
    # while Quarto scans inputs, before pre-render runs, so an include of a
    # generated file fails on a clean checkout. See tools/fx_include.lua.
    filters:
      - tools/fx_include.lua
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <!-- One request for every face the site uses. Source Serif 4 is the
               Cascadia voice (styles.scss, charts and the page bodies this
               release leaves alone); Inter, Inter Tight, Fraunces italic and
               JetBrains Mono are Felix's four (felix-design-system.md §1.3),
               global because the header and footer need them on every page.
               All five are on Google Fonts under the SIL OFL. -->
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&family=Fraunces:ital,wght@1,400&family=JetBrains+Mono:wght@400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
          <!-- Ribbon's icon uses a dark contrast tile in either browser theme.
               Quarto emits the SVG link; raster fallbacks and home-screen
               metadata are declared here. No web app manifest is installed. -->
          <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32">
          <link rel="icon" href="/assets/brand/favicon-16.png" sizes="16x16">
          <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
    theme:
      - cosmo
      - styles.scss
      # The Felix chrome layer, after the Cascadia layer so its rules win
      # where both speak; its tokens are kept apart from $cascadia-*.
      - felix.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
