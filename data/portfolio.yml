  family: ""
  domain: "Mathematics · A pet project"
  type: paper
  status: Preprint
  new: false
  summary: "Not an analytics module: a short mathematics paper. The number of ways n children can take sides against each other, with the rest uninvolved, is (3<sup>n</sup> − 2·2<sup>n</sup> + 1)/2, the Stirling number S(n+1, 3). Of the 25 ways four children can, 6 are one against one; of the 3,025 ways eight children can, 28 are."
