# The portfolio inventory: one entry per page the Case Studies dropdown in
# _quarto.yml links to, and nothing else. Every card on the homepage and on
# /case-studies.html is rendered from this file through one template,
# _templates/fx-card.ejs; no card is hand-written. Decided 2026-10-14
# (reskin phase one, ADR 0002).
#
# WHY data/ AND NOT _data/. Quarto's listing resolver excludes every path
# that starts with an underscore ("_*", "**/_*"), so a listing whose
# `contents:` names _data/portfolio.yml matches nothing and renders empty
# (tried 2026-10-14 on Quarto 1.9.38). This directory therefore has no
# leading underscore. Quarto does not render .yml files, so nothing here
# becomes a page.
#
# ORDER. Everything is sorted by `order`, ascending. The number a card shows
# ("01", "02", ...) is its DISPLAY POSITION in that sort, computed by the
# template at render time. It is not a build number and it moves when an
# entry is added above it. For the data builds, `order` copies the position
# in the Builds & Their Stacks table on cascadia.qmd, which the
# surface-module skill keeps newest first; for the playbooks, the paper and
# the process map it is the position they hold in the dropdown. No git
# dates, no inference from when a wrapper landed.
#
# FIELDS
#   slug         stable identifier, also the key the homepage names its
#                feature card by
#   title        the title WITHOUT the family word (the card prints
#                "<family> <title>", family in muted ink)
#   family       "Cascadia" for the Cascadia-prefixed pages, "" otherwise
#   domain       the mono eyebrow line (the .card-label on index.qmd where
#                one existed, else the .cs-domain of the case-study page)
#   type         work type: case-study | playbook | paper | process. It is
#                never shown as a status; it supplies the small suffix next
#                to the card number ("Case study", "Playbook", ...).
#   status       publication state in the SITE'S OWN WORDS, mapped from
#                what the site said on 2026-10-14: a card badged Published
#                stays Published; a build the family table calls "Case
#                Study" is Complete; "Planned" there is Coming Soon;
#                Playbook and Preprint stay. The status tab row on the index
#                mixes these with the two type-like words (Playbook,
#                Preprint) on purpose; `type` and `status` are kept apart so
#                that can be split later without touching content.
#   new          true/false, its own field, never a status
#   summary      three lines at card width. Output unescaped by the template
#                so <sup> can be used; write & as &amp; if one is ever
#                needed. No em dashes. No counts that go stale.
#   lede         feature card only: the takeaway sentence
#   tags         stack words from the family page's table; empty where that
#                table has no row for the entry
#   href         the case study (site-root-relative .html, or absolute for
#                a page served from another repository)
#   module_href  the live module, where one exists
#   module_label the visible text of that second link
#   order        integer, see ORDER above
#   featured     true for the three builds the homepage carries under
#                "Selected builds", chosen by capability (2026-10-14):
#                Early Warning, Revenue Assurance, Matter Ledger
#   note         the placement comment carried over from _quarto.yml

