name: Generate visual baselines

# Manual only. This exists because visual-regression baselines are only valid
# if they were produced on the same image that will later compare against them:
# font hinting, subpixel rendering and the installed font set all differ between
# a Windows workstation and an ubuntu runner, and a baseline generated locally
# would make the check permanently red for reasons unrelated to the site.
#
# It deliberately does NOT commit anything. In this repo the pull-request merge
# IS the deploy and the single deliberate approval (ADR 0003), a workflow that
# writes to `main` would quietly break that property, and the ruleset on `main`
# would refuse the push besides. So: the runner generates, a human downloads
# the artifact and commits it on a branch.
#
# Since candidate.yml, an intended change to one page does not need this: the
# pull request's candidate run uploads every screenshot it compared, and those
# are the new baselines for the changed pages. Run this when the runner image
# moves and the whole set drifts uniformly.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "Origin to screenshot"
        required: false
        default: "https://www.robbinsanalytics.com"

permissions:
  contents: read

jobs:
  baselines:
    # Must match candidate.yml and publish.yml, or the baselines it makes
    # are for a different image than the one that compares against them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright and Pillow
        run: |
          python -m pip install --quiet playwright==1.64.0 pillow
          python -m playwright install --with-deps chromium

      - name: Screenshot every page at every width
        run: |
          python tools/visual_check.py \
            --origin "${{ inputs.origin }}" \
            --update

      - name: Upload the baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: .github/visual-baselines/
          if-no-files-found: error
          retention-days: 7

      - name: What to do with this artifact
        run: |
          echo "Download the 'visual-baselines' artifact, unzip it into"
          echo ".github/visual-baselines/, and commit the images."
          echo "They are only valid because they were produced on this runner."
