name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: read
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Prose that restates a machine-readable fact drifts, and the prose is
      # what the next person reads. Runs before the build so a stale reference
      # fails the run without deploying. See tools/check_references.py for what
      # is checked and, just as importantly, what is deliberately not.
      - name: Check stated facts against their sources
        run: python tools/check_references.py

      - name: Regenerate OG thumbnails
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tools/build_thumbs.py --out assets --strict

      # Same reason the thumbnails are regenerated rather than committed by
      # hand: the icons are derived from assets/brand/robbins-mark*.svg, and a
      # hand-edited PNG that drifts from the mark is exactly the failure this
      # prevents. Cheap — it is the Chromium that is already installed above.
      - name: Regenerate the icon set
        run: python tools/build_icons.py --out assets/brand

      # Stamp this deploy so the verification steps below can tell the live
      # site apart from whatever the CDN was serving a minute ago. Must run
      # before the publish step — Quarto copies build.txt into _site as a
      # resource (see _quarto.yml).
      - name: Stamp the build
        run: echo "${{ github.sha }}" > build.txt

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Self-verification. Everything below runs after deployment and fails the
      # Action on any miss, which is the only notification that has ever
      # actually worked: a red run emails Aaron. Verification used to happen in
      # a local shell right after the push, where it could pass against a stale
      # edge — the Action was green while the CDN served the previous build for
      # another two minutes.
      # ---------------------------------------------------------------------

      # Checked first because it is instant and it explains the most likely
      # failure of the next step. `quarto publish gh-pages` force-pushes the
      # branch, so a missing CNAME in _site silently clears the custom domain —
      # after which www stops resolving to the site at all and the edge poll
      # would just time out with no clue why.
      - name: Assert the custom domain survived the force-push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cname="$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // ""')"
          if [ "$cname" != "www.robbinsanalytics.com" ]; then
            echo "::error::GitHub Pages cname is '${cname:-<empty>}', expected www.robbinsanalytics.com."
            echo "CNAME did not survive the gh-pages force-push. Check that _quarto.yml still lists CNAME under resources:."
            exit 1
          fi
          echo "Pages cname = $cname"

      - name: Wait for the edge to serve this commit
        run: |
          set -uo pipefail
          expected="${{ github.sha }}"
          for attempt in $(seq 1 40); do
            actual="$(curl -sS --max-time 20 \
              "https://www.robbinsanalytics.com/build.txt?cb=${expected}-${attempt}" \
              | tr -d '[:space:]' || true)"
            if [ "$actual" = "$expected" ]; then
              echo "Edge is serving $expected (after $(( (attempt - 1) * 15 ))s)."
              exit 0
            fi
            echo "attempt ${attempt}/40: edge has '${actual:-<none>}', want '${expected}'"
            sleep 15
          done
          echo "::error::https://www.robbinsanalytics.com/build.txt never returned ${expected} within 10 minutes."
          echo "The Action deployed, but the live site is not serving this build. Do not report this deploy as successful."
          exit 1

      # Only runs once the edge is known to be on this commit, so a 404 here is
      # a real broken page and not propagation lag.
      - name: Verify the live pages
        run: |
          set -uo pipefail
          sha="${{ github.sha }}"
          fail=0
          check() {  # check <expected-code> <url>
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$2" || echo 000)"
            if [ "$code" = "$1" ]; then
              echo "  ok   $1  $2"
            else
              echo "::error::expected $1, got $code — $2"
              fail=1
            fi
          }
          for path in / /about.html /cascadia.html \
                      /projects/cascadia-finance.html \
                      /projects/cascadia-dealdesk.html \
                      /projects/sibling-conflict.html \
                      /assets/thumb-finance.png \
                      /assets/Robbins-Combinatorics-of-Sibling-Conflict.pdf \
                      /projects/cascadia-semiconductors.html \
                      /cascadia-semiconductors/ \
                      /cascadia-semiconductors/margins.html \
                      /cascadia-semiconductors/peers.html \
                      /cascadia-semiconductors/q2-filed.html \
                      /cascadia-semiconductors/q2-readthrough.html \
                      /cascadia-semiconductors/assets/og-finance.png; do
            check 200 "https://www.robbinsanalytics.com${path}?cb=${sha}"
          done
          # Everything from /projects/cascadia-semiconductors.html down is an
          # OLD Cascadia Finance URL that must keep returning 200 forever.
          # The case-study path is served by Quarto's `aliases:` redirect; the
          # /cascadia-semiconductors/* paths are served by the project repo
          # today and by the redirect stubs in that directory once the repo
          # rename frees the path. GitHub does not redirect project Pages URLs
          # on a repo rename, so nothing else guards these. The og-finance.png
          # is checked too: every social card already shared points at it, and
          # a meta-refresh page cannot serve an image.
          # The apex and github.io addresses must keep redirecting; old links
          # and previously shared social cards point at both.
          check 301 "https://robbinsanalytics.com/?cb=${sha}"
          check 301 "https://robbinsanalytics.github.io/?cb=${sha}"
          exit $fail

      # ---------------------------------------------------------------------
      # The two sweeps below run only after the edge is confirmed to be on this
      # commit, so a failure here is a real defect and not propagation lag. Both
      # fail the run, which is the only notification that has ever worked.
      # ---------------------------------------------------------------------

      # The fixed list above is a contract -- it names the URLs that must never
      # break. This is the sweep that finds a link a page acquired last week.
      # Its first run found two dead ones: a GitHub explainer path that never
      # existed and a CDC page that moved.
      - name: Crawl every link on the site
        run: python tools/crawl_links.py --cache-bust "${{ github.sha }}"

      # REGRESSION PREVENTION, NOT PROOF OF CONFORMANCE. Automated tooling
      # reaches roughly 30-40% of WCAG success criteria; the rest needs a
      # person. A green run here means no machine-detectable regression and
      # nothing more. This repo's HEAD once had to remove five unverified
      # "WCAG 2.2 AA" claims -- do not let this job become the sixth. The site
      # says "target (unverified)" and that stays true.
      - name: Accessibility regression check
        run: |
          python -m pip install --quiet axe-core-python==0.1.0
          python tools/a11y_check.py --cache-bust "${{ github.sha }}"

      # Compares six pages at four widths against the images in
      # .github/visual-baselines/. Those are only valid because they were
      # produced on this same runner image by the "Generate visual baselines"
      # workflow -- a screenshot taken on Windows differs from a Linux one in
      # font rendering alone, so a locally generated baseline would make this
      # permanently red.
      #
      # A failure here is a prompt to look, not a verdict. An unintended
      # regression gets fixed; an intended design change gets fresh baselines
      # from that workflow, downloaded and committed deliberately. This runs
      # after the deploy for the same reason every other check does -- it
      # compares what the edge is actually serving.
      - name: Visual regression check
        run: |
          python -m pip install --quiet pillow
          python tools/visual_check.py --cache-bust "${{ github.sha }}"

      # Without this a failure above is just a percentage. The diff images make
      # it something a person can judge in ten seconds.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-${{ github.sha }}
          path: visual-diffs/
          if-no-files-found: ignore
          retention-days: 14
